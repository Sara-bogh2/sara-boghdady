<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sara Boghdady — Creative Designer</title>
<meta name="description" content="Sara Boghdady — AI designs, AI videos, websites, Shopify stores and presentations.">
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  --bg:#0b1020; --surface:#131a2c; --surface2:#1a2338; --line:rgba(244,246,250,.09);
  --text:#f4f6fa; --muted:#9ba5ba; --cyan:#4d8dff; --violet:#f4f6fa;
  --radius:18px; --max:1200px;
  --f-head:'Space Grotesk','IBM Plex Sans Arabic',sans-serif;
  --f-body:'Inter','IBM Plex Sans Arabic',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,monospace;
}
html[lang="ar"]{--f-head:'IBM Plex Sans Arabic','Space Grotesk',sans-serif;--f-body:'IBM Plex Sans Arabic','Inter',sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
.mono{font-family:var(--f-mono);letter-spacing:.08em;font-size:13px;text-transform:uppercase;direction:ltr;unicode-bidi:isolate}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:6px}

/* intro */
#intro{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;transition:opacity .6s ease,visibility .6s}
#intro.done{opacity:0;visibility:hidden}
#intro .tc{font-family:var(--f-mono);font-size:clamp(28px,6vw,56px);color:var(--text);letter-spacing:.06em;direction:ltr}
#intro .tc b{color:var(--cyan);font-weight:400}
#intro .bar{width:220px;height:2px;background:var(--line);margin:22px auto 0;overflow:hidden}
#intro .bar i{display:block;height:100%;width:0;background:var(--cyan);animation:load 1.1s ease forwards}
@keyframes load{to{width:100%}}

/* nav */
header{position:fixed;top:0;inset-inline:0;z-index:50;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
header.scrolled{background:rgba(11,16,32,.85);backdrop-filter:blur(14px);border-color:var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:72px;gap:16px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;font-family:'Space Grotesk';font-weight:500;letter-spacing:.04em}
.mono-mark{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--cyan);display:grid;place-items:center;font-family:'Space Grotesk';font-weight:700;font-size:16px;color:var(--cyan)}
.links{display:flex;gap:28px;align-items:center}
.links a{text-decoration:none;color:var(--muted);font-size:15px;transition:color .2s}
.links a:hover{color:var(--text)}
.lang{border:1px solid var(--line);background:transparent;border-radius:30px;padding:8px 16px;cursor:pointer;font-family:var(--f-mono);font-size:13px;min-height:40px;transition:border-color .2s}
.lang:hover{border-color:var(--cyan)}
@media (max-width:760px){.links a{display:none}}

/* hero */
.hero{min-height:100vh;padding:130px 0 70px;position:relative;display:flex;align-items:center;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/72px 72px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/72px 72px;mask-image:linear-gradient(#000,transparent 85%);-webkit-mask-image:linear-gradient(#000,transparent 85%);opacity:.45}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;width:100%}
.rec{display:inline-flex;align-items:center;gap:10px;color:var(--muted);margin-bottom:28px}
.rec i{width:9px;height:9px;border-radius:50%;background:#ff4d5e;animation:blink 1.6s infinite}
.rec .t{color:var(--cyan)}
@keyframes blink{50%{opacity:.25}}
h1{font-family:var(--f-head);font-weight:700;font-size:clamp(42px,6.6vw,86px);line-height:1.06;letter-spacing:-.02em;margin:0 0 24px}
html[lang="ar"] h1{letter-spacing:0;line-height:1.25}
h1 .c{color:var(--cyan)}
.lead{color:var(--muted);font-size:clamp(17px,1.6vw,20px);max-width:520px;margin:0 0 36px}
.ctas{display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:50px;padding:0 26px;border-radius:12px;text-decoration:none;font-weight:600;font-size:16px;transition:transform .2s,background .2s,border-color .2s;cursor:pointer;border:0}
.btn.p{background:var(--cyan);color:#061029}
.btn.p:hover{transform:translateY(-2px)}
.btn.g{border:1px solid var(--line);background:transparent}
.btn.g:hover{border-color:var(--violet)}
.btn svg{width:18px;height:18px}
html[dir="rtl"] .flip{transform:scaleX(-1)}

.stack{position:relative;height:520px}
.stack .card{position:absolute;border-radius:16px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.55);border:1px solid var(--line);animation:float 7s ease-in-out infinite}
.stack .card img{width:100%;height:100%;object-fit:cover}
.stack .a{width:58%;aspect-ratio:4/5;inset-inline-start:0;top:30px;transform:rotate(-6deg);--r:-6deg}
.stack .b{width:52%;aspect-ratio:4/5;inset-inline-end:0;top:0;animation-delay:-2s;--r:5deg;transform:rotate(5deg)}
.stack .c{width:62%;aspect-ratio:16/9;inset-inline-start:18%;bottom:0;animation-delay:-4s;--r:-1deg;transform:rotate(-1deg)}
@keyframes float{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-12px) rotate(var(--r))}}
@media (max-width:900px){.hero .wrap{grid-template-columns:1fr}.stack{height:400px;max-width:460px;width:100%;margin:20px auto 0}}

/* strip */
.strip{border-block:1px solid var(--line);overflow:hidden;padding:20px 0;background:var(--surface)}
.strip .row{display:flex;gap:48px;width:max-content;animation:marq 38s linear infinite;direction:ltr}
.strip span{font-family:'Space Grotesk';font-size:22px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:48px}
.strip span:after{content:"";width:7px;height:7px;border-radius:50%;background:var(--cyan)}
@keyframes marq{to{transform:translateX(-50%)}}

/* sections */
section{padding:110px 0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:44px;flex-wrap:wrap}
.kick{color:var(--cyan);margin-bottom:12px;display:block}
h2{font-family:var(--f-head);font-weight:700;font-size:clamp(32px,4.4vw,54px);line-height:1.1;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);max-width:440px;margin:0}

/* tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:32px}
.tab{border:1px solid var(--line);background:transparent;border-radius:40px;padding:0 18px;min-height:44px;cursor:pointer;color:var(--muted);font-size:15px;transition:all .2s;display:inline-flex;align-items:center;gap:8px}
.tab .n{font-family:var(--f-mono);font-size:12px;opacity:.7}
.tab:hover{color:var(--text);border-color:rgba(255,255,255,.25)}
.tab[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.item{display:block;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;padding:0;transition:transform .35s cubic-bezier(.2,.7,.2,1),border-color .3s}
.item:hover{transform:translateY(-6px);border-color:rgba(77,141,255,.5)}
.item .im{overflow:hidden;position:relative;background:#000}
.item .im{aspect-ratio:1/1}
.item .im img{width:100%;height:100%;object-fit:cover;object-position:var(--pos,center top);transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.item:hover .im img{transform:scale(1.04)}
.badge{position:absolute;top:12px;inset-inline-start:12px;background:rgba(11,16,32,.8);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:30px;padding:5px 11px;font-size:11px}
.play{position:absolute;inset:0;display:grid;place-items:center}
.pv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.item.playing .pv{opacity:1}
.item.playing .play{opacity:0}
.play{transition:opacity .3s}
.play i{width:64px;height:64px;border-radius:50%;background:rgba(11,16,32,.72);border:1px solid rgba(244,246,250,.3);display:grid;place-items:center}
.meta{padding:18px 20px 20px}
.meta .cat{color:var(--cyan);font-size:12px}
html[lang="ar"] .cat{font-family:var(--f-body);letter-spacing:0;font-size:14px;direction:rtl}
.meta h3{font-family:var(--f-head);font-size:20px;margin:6px 0 4px;font-weight:600}
.meta p{color:var(--muted);font-size:15px;margin:0}

/* chapters + category sections */
.index-wrap{padding-bottom:40px}
.chapters{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.chapters a{display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;border:1px solid var(--line);border-radius:14px;padding:18px 20px;background:var(--surface);transition:border-color .25s,transform .25s}
.chapters a:hover{border-color:var(--cyan);transform:translateY(-3px)}
.chapters b{font-weight:600;font-size:16px}
.chapters .mono{color:var(--muted)}
.chapters .no{color:var(--cyan)}
.catsec{padding:0 0 110px}
.catsec.alt{background:var(--surface)}
.catsec.alt .item{background:var(--bg)}
.sep{display:flex;align-items:center;gap:18px;padding:70px 0 60px;color:var(--muted)}
.sep:before,.sep:after{content:"";flex:1;height:1px;background:var(--line)}
.sep span{border:1px solid var(--line);border-radius:30px;padding:8px 16px;white-space:nowrap}
.sep i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--cyan);margin-inline-end:10px;vertical-align:middle}
.cathead{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:end;margin-bottom:40px}
.cathead .big{font-family:'Space Grotesk';font-weight:700;font-size:clamp(64px,9vw,120px);line-height:.85;color:transparent;-webkit-text-stroke:1.5px var(--cyan)}
.cathead h2{margin-bottom:10px}
.cathead .count{color:var(--muted);white-space:nowrap}
@media (max-width:760px){.cathead{grid-template-columns:1fr}.cathead .count{display:none}}
.grid.feature{grid-template-columns:1fr}
.grid.feature .item{display:grid;grid-template-columns:1.5fr 1fr;align-items:center}
.grid.feature .im{aspect-ratio:16/10}
.grid.feature .meta{padding:34px 38px}
.grid.feature .meta h3{font-size:clamp(22px,2.4vw,30px);margin:10px 0 12px}
.grid.feature .meta .d{display:block;color:#d5dbe7;font-size:16px;margin-top:14px;line-height:1.7}
.meta .d{display:none}
.grid.feature .more{display:inline-flex;margin-top:22px;color:var(--cyan);font-weight:600;font-size:15px;gap:8px;align-items:center}
@media (max-width:760px){.grid.feature .item{grid-template-columns:1fr}.grid.feature .meta{padding:20px}}
.viewer.tall{background:var(--surface)}
.viewer.tall img{max-height:none;max-width:920px;width:100%}

/* services */
.svc{border-top:1px solid var(--line)}
.svc li{list-style:none;display:grid;grid-template-columns:90px 1fr 1.2fr;gap:24px;padding:30px 0;border-bottom:1px solid var(--line);align-items:baseline;transition:padding .3s}
.svc li:hover{padding-inline-start:12px}
.svc li:hover .num{color:var(--cyan)}
.svc .num{font-family:var(--f-mono);color:var(--muted);transition:color .3s;direction:ltr}
.svc h3{font-family:var(--f-head);font-size:clamp(22px,2.6vw,32px);margin:0;font-weight:600}
.svc p{color:var(--muted);margin:0}
.svc ul{padding:0;margin:0}
@media (max-width:760px){.svc li{grid-template-columns:50px 1fr}.svc p{grid-column:2}}

/* manifesto */
.manifesto{background:var(--surface);border-block:1px solid var(--line)}
.manifesto blockquote{margin:0;font-family:var(--f-head);font-size:clamp(26px,3.6vw,46px);line-height:1.35;font-weight:500;max-width:980px}
.manifesto blockquote em{font-style:normal;color:var(--muted);text-decoration:line-through;text-decoration-thickness:2px}
.manifesto blockquote span{color:var(--cyan)}

/* about */
.about{display:grid;grid-template-columns:.8fr 1.2fr;gap:60px;align-items:start}
.about .big{font-family:'Space Grotesk';font-weight:700;font-size:clamp(70px,11vw,150px);line-height:.9;color:transparent;-webkit-text-stroke:1.5px rgba(244,246,250,.22);direction:ltr}
.about p{font-size:19px;color:#d5dbe7;margin:0 0 18px}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.tools span{border:1px solid var(--line);border-radius:30px;padding:7px 14px;font-size:14px;color:var(--muted);direction:ltr}
@media (max-width:900px){.about{grid-template-columns:1fr;gap:20px}}

/* contact */
.contact{text-align:center}
.contact h2{font-size:clamp(40px,7vw,96px);margin-bottom:18px}
.contact .sub{margin:0 auto 40px}
.chan{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:50px;text-align:start}
.chan a{border:1px solid var(--line);border-radius:var(--radius);padding:22px;text-decoration:none;background:var(--surface);transition:border-color .25s,transform .25s;display:block}
.chan a:hover{border-color:var(--cyan);transform:translateY(-3px)}
.chan small{display:block;color:var(--muted);margin-bottom:6px}
.chan b{font-weight:500;font-size:15px;direction:ltr;unicode-bidi:isolate;display:block;word-break:break-all}
@media (max-width:900px){.chan{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.chan{grid-template-columns:1fr}}
footer{border-top:1px solid var(--line);padding:28px 0;color:var(--muted);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* reveal */
.rv{opacity:0;transform:translateY(22px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}

/* modal */
.modal{position:fixed;inset:0;z-index:80;background:rgba(7,10,22,.94);backdrop-filter:blur(8px);display:none;overflow-y:auto}
.modal.open{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0}}
.modal .box{max-width:1100px;margin:0 auto;padding:80px 24px 50px;position:relative}
.close{position:fixed;top:18px;inset-inline-end:18px;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;z-index:2}
.viewer{position:relative;border-radius:14px;overflow:hidden;background:#000;border:1px solid var(--line)}
.viewer img,.viewer video{width:100%;max-height:78vh;object-fit:contain;margin:0 auto}
.nav-btn{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(11,16,32,.72);cursor:pointer;display:grid;place-items:center}
.nav-btn.prev{inset-inline-start:14px}.nav-btn.next{inset-inline-end:14px}
.count{position:absolute;bottom:12px;inset-inline-end:14px;background:rgba(11,16,32,.78);padding:4px 10px;border-radius:20px;font-size:12px}
.thumbs{display:flex;gap:10px;margin-top:14px;overflow-x:auto;padding-bottom:6px}
.thumbs button{flex:none;width:110px;border:2px solid transparent;border-radius:8px;overflow:hidden;padding:0;cursor:pointer;background:none;opacity:.55;transition:opacity .2s}
.thumbs button[aria-current="true"]{border-color:var(--cyan);opacity:1}
.info{display:grid;grid-template-columns:1.4fr 1fr;gap:40px;margin-top:34px}
.info h3{font-family:var(--f-head);font-size:clamp(26px,3vw,38px);margin:8px 0 12px}
.info p{color:#d5dbe7;margin:0}
.facts{border:1px solid var(--line);border-radius:14px;padding:6px 20px}
.facts div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.facts div:last-child{border:0}
.facts dt{color:var(--muted)}
.facts dd{margin:0;text-align:end}
@media (max-width:760px){.info{grid-template-columns:1fr}}

@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}#intro{display:none}}
</style>
</head>
<body>

<div id="intro" aria-hidden="true"><div><div class="tc" id="introTc">00:00:00:<b>00</b></div><div class="bar"><i></i></div></div></div>

<header id="top">

<footer><div class="wrap"><span>© <span id="yr"></span> Sara Boghdady</span><span class="mono">Designed with intention · Cairo</span></div></footer>

<script>
/* ==========================================================

        ${isVid && w.video ? `<video class="pv" src="${w.video}" muted loop playsinline preload="none" aria-hidden="true"></video>` : ""}
        ${isVid ? `<span class="play"><i><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></i></span>` : ""}
        ${w.type === "presentation" ? `<span class="badge mono" style="inset-inline-start:auto;inset-inline-end:12px">${w.images.length} slides</span>` : ""}
      </div>
      <div class="meta"><span class="cat">${esc(w.client ? w.client[lang] : "")}</span><h3>${esc(w.title[lang])}</h3>
        <p>${esc(w.tools || "")}</p>
        ${feature ? `<span class="d">${esc(w.desc[lang])}</span><span class="more">${d.open_word} <svg class="flip" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>` : ""}
      </div>
    </button>`;
}

function renderSections(){
  const d = T[lang];
  const secs = SECTIONS.map(c => ({...c, items: WORK.filter(w => w.type === c.key)})).filter(c => c.items.length);
  const total = secs.length, pad2 = n => String(n).padStart(2, "0");
  $("#chapters").innerHTML = secs.map((c,i) => `<a href="#sec-${c.key}"><span><span class="mono no">${pad2(i+1)}</span><br><b>${esc(c[lang][0])}</b></span><span class="mono">${c.items.length}</span></a>`).join("");
  $("#cats").innerHTML = secs.map((c,i) => {
    const feature = c.items.length <= 2;
    return `<section class="catsec${i % 2 ? "" : " alt"}" id="sec-${c.key}" aria-labelledby="h-${c.key}">
      <div class="wrap">
        <div class="sep mono" aria-hidden="true"><span><i></i>${pad2(i+1)} / ${pad2(total)}</span></div>
        <div class="cathead rv">
          <div class="big" aria-hidden="true">${pad2(i+1)}</div>
          <div><h2 id="h-${c.key}">${esc(c[lang][0])}</h2><p class="sub">${esc(c[lang][1])}</p></div>
        </div>
        <div class="grid${feature ? " feature" : ""}">${c.items.map(w => card(w, feature)).join("")}</div>
      </div>
    </section>`;
  }).join("");
  observe();
}

$("#cats").addEventListener("click", e => {
  const b = e.target.closest(".item"); if (b) openItem(b.dataset.id, b);
});
const canHover = matchMedia("(hover: hover)").matches && !matchMedia("(prefers-reduced-motion: reduce)").matches;
$("#cats").addEventListener("mouseover", e => {
  if (!canHover) return;
  const it = e.target.closest(".item"); const v = it && it.querySelector(".pv");
  if (!v || it.classList.contains("playing")) return;
  it.classList.add("playing"); v.play().catch(() => it.classList.remove("playing"));
});
$("#cats").addEventListener("mouseout", e => {
  const it = e.target.closest(".item"); if (!it || it.contains(e.relatedTarget)) return;
  const v = it.querySelector(".pv"); if (v) { v.pause(); it.classList.remove("playing"); }
});
$("#langBtn").addEventListener("click", () => {
  lang = lang === "ar" ? "en" : "ar";
  try { localStorage.setItem("sb-lang", lang); } catch(e) {}
  applyLang();
});

/* modal */
let cur = null, idx = 0, lastFocus = null;
const arrow = d => `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="${d}"/></svg>`;
function openItem(id, from){
  cur = WORK.find(w => w.id === id); if (!cur) return;
  idx = 0; lastFocus = from;
  renderModal();
  $("#modal").classList.add("open"); document.body.style.overflow = "hidden";
  $("#mClose").focus();
}
function renderModal(){
  const w = cur, d = T[lang], many = w.images.length > 1 && !w.video;
  let view;
  if (w.video) view = `<video src="${w.video}" poster="${w.images[0]}" controls playsinline autoplay></video>`;
  else view = `<img src="${w.images[idx]}" alt="${esc(w.title[lang])} — ${idx+1}">` +
    (many ? `<button class="nav-btn prev" type="button" data-step="-1" aria-label="Previous">${arrow("M15 6l-6 6 6 6")}</button>
             <button class="nav-btn next" type="button" data-step="1" aria-label="Next">${arrow("M9 6l6 6-6 6")}</button>
             <span class="count mono">${idx+1} / ${w.images.length}</span>` : "");
  const thumbs = many ? `<div class="thumbs">${w.images.map((s,i)=>`<button type="button" data-go="${i}" aria-current="${i===idx}" aria-label="${i+1}"><img src="${s}" alt=""></button>`).join("")}</div>` : "";
  $("#mBox").innerHTML = `<div class="viewer${w.tall ? " tall" : ""}" dir="ltr">${view}</div>${thumbs}
    <div class="info">
      <div><span class="cat mono" style="color:var(--cyan)">${esc(catName(w.type))}${w.concept ? " · " + d.concept : ""}</span>
        <h3 id="mTitle">${esc(w.title[lang])}</h3><p>${esc(w.desc[lang])}</p>
        ${w.url ? `<p style="margin-top:22px"><a class="btn p" href="${w.url}" target="_blank" rel="noopener">${d.visit}</a></p>` : ""}
      </div>
      <dl class="facts">
        ${w.client ? `<div><dt>${d.client}</dt><dd>${esc(w.client[lang])}</dd></div>` : ""}
        ${w.tools ? `<div><dt>${d.tools}</dt><dd>${esc(w.tools)}</dd></div>` : ""}
        ${w.format ? `<div><dt>${d.format}</dt><dd dir="ltr">${esc(w.format)}</dd></div>` : ""}
      </dl>
    </div>`;
}
function step(n){ if (!cur || cur.images.length < 2) return; idx = (idx + n + cur.images.length) % cur.images.length; renderModal(); }
function closeModal(){
  $("#modal").classList.remove("open"); document.body.style.overflow = "";
  const v = $("#mBox video"); if (v) v.pause();
  cur = null; if (lastFocus) lastFocus.focus();
}
$("#mClose").addEventListener("click", closeModal);
$("#modal").addEventListener("click", e => {
  if (e.target.id === "modal" || e.target.classList.contains("box")) return closeModal();
  const s = e.target.closest("[data-step]"); if (s) return step(+s.dataset.step);
  const g = e.target.closest("[data-go]"); if (g) { idx = +g.dataset.go; renderModal(); }
});
$("#modal").addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
  if (e.key === "ArrowRight") step(1);
  if (e.key === "ArrowLeft") step(-1);
});
let tx = null;
$("#modal").addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, {passive:true});
$("#modal").addEventListener("touchend", e => {
  if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
});

/* reveal on scroll */
const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(en => {
  if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); }
}), {threshold:.12}) : null;
function observe(){
  document.querySelectorAll(".rv:not(.in)").forEach((el,i) => {
    if (!io) return el.classList.add("in");
    el.style.transitionDelay = (el.classList.contains("item") ? (i % 3) * 80 : 0) + "ms";
    io.observe(el);
  });
}

/* header + timecode */
addEventListener("scroll", () => $("#top").classList.toggle("scrolled", scrollY > 20), {passive:true});
const pad = n => String(n).padStart(2,"0"), t0 = performance.now();
setInterval(() => {
  const ms = performance.now() - t0, s = Math.floor(ms/1000);
  $("#tc").textContent = `00:${pad(Math.floor(s/60)%60)}:${pad(s%60)}:${pad(Math.floor((ms%1000)/1000*24))}`;
}, 1000/24);

/* intro */
(function(){
  const el = $("#intro"), tc = $("#introTc"), start = performance.now();
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) { el.classList.add("done"); return; }
  (function tick(){
    const p = Math.min(1, (performance.now() - start) / 1100), f = Math.floor(p * 96);
    tc.innerHTML = `00:00:${pad(Math.floor(f/24))}:<b>${pad(f%24)}</b>`;
    if (p < 1) requestAnimationFrame(tick); else setTimeout(() => el.classList.add("done"), 200);
  })();
})();

$("#yr").textContent = new Date().getFullYear();
applyLang();
</script>
</body>
</html>
